services:
  origincast:
    build: .
    container_name: origincast
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      HOST: "0.0.0.0"
      PORT: "5000"
      MOVIES_DIR: "/app/movies"
      TV_DIR: "/app/tv"
      DATA_DIR: "/app/data"
      ADMIN_USER: "${ADMIN_USER:-admin}"
      ADMIN_PASS: "${ADMIN_PASS:-admin123}"
      SECRET_KEY: "${SECRET_KEY:-origincast-change-this-secret-key}"
      # Optional metadata & Google Drive overrides:
      # OMDB_API_KEY: ""
      # GDRIVE_API_KEY: ""
      # GDRIVE_MOVIES_FOLDER: ""
      # GDRIVE_TV_FOLDER: ""
    volumes:
      - ./movies:/app/movies
      - ./tv:/app/tv
      - origincast_data:/app/data

volumes:
  origincast_data:
